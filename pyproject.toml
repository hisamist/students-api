[tool.ruff]
# Maximum line length (standard is 88, like Black)
line-length = 100

# Rules selection
# E/W: Error/Warning (Pycodestyle)
# F: Pyflakes (Unused variables/imports)
# B: Bugbear (Common design flaws)
# I: Isort (Import sorting)
# UP: Pyupgrade (Modern Python syntax)
select = ["E", "F"]

# Ignore specific rules if needed
ignore = ["D100"]

[tool.ruff.lint]
# Ensure we catch unused variables and imports
exclude = ["__init__.py"] # Sometimes needed for exports

[tool.ruff.format]
# Enable automatic formatting to match indentation rules
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.taskipy.tasks]
dev = "python -m uvicorn app.main:app --reload"
test = "python -m pytest"
lint = "python -m ruff check ."
format = "python -m ruff check . --fix"