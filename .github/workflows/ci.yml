# ========================================
# WORKFLOW NAME
# ========================================
# This name appears in the "Actions" tab of your GitHub repository.
name: Students API CI

# ========================================
# TRIGGERS (WHEN the workflow runs)
# ========================================
on:
  # Triggered on every push to the main branch
  push:
    branches: [ "main" ]
  # Triggered on every Pull Request targeting the main branch
  pull_request:
    branches: [ "main" ]

# ========================================
# JOBS (The tasks to execute)
# ========================================
jobs:
  # --- JOB 1: BUILD, LINT, AND TEST ---
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest # The Virtual Machine (Runner)

    # Matrix strategy to test on multiple Python versions
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      # Step 1: Checkout the source code
      # This pulls your code from the repo into the Runner.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up the Python environment
      # Uses the version defined in the matrix above.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3: Install dependencies
      # Upgrades pip and installs packages from requirements.txt.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Linting (Quality Check)
      # Runs Ruff to ensure the code is clean and follows the rules.
      - name: Verification of code (Lint)
        run: python -m ruff check .

      # Step 5: Unit Tests with Coverage
      # Generates a report and fails if tests fail.
      - name: Run Unit Tests with Coverage
        run: |
          python -m pytest --cov=app --cov-report=xml --cov-report=term-missing

      # Step 6: Generate Coverage Summary
      # This creates a nice table in the GitHub Actions "Summary" tab.
      - name: Generate Coverage Summary
        run: |
          echo "### 📊 Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          python -m pytest --cov=app --cov-report=term-missing >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Step 7: Upload Coverage Artifact (Optional)
      # Keeps the XML report as a downloadable file for 90 days.
      - name: Upload Coverage Report
        uses: actions/checkout@v4
        with:
          name: coverage-xml
          path: coverage.xml